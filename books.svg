    <rect x="355" y="40" width="95" height="180" fill="#3a4a63"/>
    <rect x="355" y="40" width="95" height="7" fill="#D6A94A"/>
    <text x="402" y="140" fill="#EAF0F7" font-size="16" font-weight="bold" text-anchor="middle" transform="rotate(-90 402 140)">Atomic Habits</text>

    <rect x="460" y="40" width="95" height="180" fill="#0A2647"/>
    <rect x="460" y="40" width="95" height="7" fill="#D6A94A"/>
    <text x="507" y="140" fill="#EAF0F7" font-size="14" font-weight="bold" text-anchor="middle" transform="rotate(-90 507 140)">The Value-Driven Business Analyst</text>

    <rect x="565" y="40" width="95" height="180" fill="#274472"/>
    <rect x="565" y="40" width="95" height="7" fill="#D6A94A"/>
    <text x="612" y="140" fill="#EAF0F7" font-size="14" font-weight="bold" text-anchor="middle" transform="rotate(-90 612 140)">Competitive Strategy</text>

    <rect x="670" y="40" width="95" height="180" fill="#1B263B"/>
    <rect x="670" y="40" width="95" height="7" fill="#D6A94A"/>
    <text x="717" y="140" fill="#EAF0F7" font-size="14" font-weight="bold" text-anchor="middle" transform="rotate(-90 717 140)">Good Strategy Bad Strategy</text>

    <rect x="775" y="40" width="90" height="180" fill="#3a4a63"/>
