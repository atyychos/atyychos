    <text x="820" y="140" fill="#EAF0F7" font-size="14" font-weight="bold" text-anchor="middle" transform="rotate(-90 820 140)">Flawless Consulting</text>
  </g>

  <!-- Shelf 1 board -->
  <rect x="20" y="222" width="860" height="12" rx="2" fill="#3a4a63"/>

  <!-- decorative bottom shelf, empty -->
  <rect x="40" y="260" width="820" height="170" fill="none"/>
  <rect x="20" y="440" width="860" height="12" rx="2" fill="#3a4a63"/>

  <!-- small bookend filler on second shelf for visual balance -->
