<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Playfair Display', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="470" fill="#0d1117"/>
  <text x="450" y="20" fill="#8b9bb4" font-size="14" text-anchor="middle" font-style="italic">Books that shaped how I think</text>

  <!-- Shelf 1 -->
  <g>
    <rect x="40" y="40" width="95" height="180" fill="#0A2647"/>
