<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Playfair Display', serif">
  <rect width="900" height="460" fill="#0d1117"/>
  <text x="450" y="30" fill="#8b9bb4" font-size="16" text-anchor="middle" font-style="italic">Books that shaped how I think</text>

  <!-- Row 1 -->
  <g>
    <rect x="20" y="55" width="195" height="180" rx="6" fill="#0A2647"/>
    <rect x="20" y="55" width="195" height="8" rx="2" fill="#D6A94A"/>
    <text x="117" y="135" fill="#EAF0F7" font-size="16" font-weight="bold" text-anchor="middle">
      <tspan x="117" dy="0">A Brief History</tspan>
      <tspan x="117" dy="22">of Time</tspan>
    </text>

    <rect x="235" y="55" width="195" height="180" rx="6" fill="#274472"/>
    <rect x="235" y="55" width="195" height="8" rx="2" fill="#D6A94A"/>
    <text x="332" y="115" fill="#EAF0F7" font-size="15" font-weight="bold" text-anchor="middle">
      <tspan x="332" dy="0">How to Win</tspan>
      <tspan x="332" dy="20">Friends &amp;</tspan>
      <tspan x="332" dy="20">Influence People</tspan>
    </text>

    <rect x="450" y="55" width="195" height="180" rx="6" fill="#1B263B"/>
    <rect x="450" y="55" width="195" height="8" rx="2" fill="#D6A94A"/>
    <text x="547" y="135" fill="#EAF0F7" font-size="16" font-weight="bold" text-anchor="middle">
      <tspan x="547" dy="0">Man's Search</tspan>
      <tspan x="547" dy="22">for Meaning</tspan>
    </text>

    <rect x="665" y="55" width="195" height="180" rx="6" fill="#3a4a63"/>
    <rect x="665" y="55" width="195" height="8" rx="2" fill="#D6A94A"/>
    <text x="762" y="150" fill="#EAF0F7" font-size="17" font-weight="bold" text-anchor="middle">
      <tspan x="762" dy="0">Atomic Habits</tspan>
    </text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="20" y="255" width="195" height="180" rx="6" fill="#3a4a63"/>
    <rect x="20" y="255" width="195" height="8" rx="2" fill="#D6A94A"/>
    <text x="117" y="335" fill="#EAF0F7" font-size="15" font-weight="bold" text-anchor="middle">
      <tspan x="117" dy="0">The Value-Driven</tspan>
      <tspan x="117" dy="22">Business Analyst</tspan>
    </text>

    <rect x="235" y="255" width="195" height="180" rx="6" fill="#0A2647"/>
    <rect x="235" y="255" width="195" height="8" rx="2" fill="#D6A94A"/>
    <text x="332" y="335" fill="#EAF0F7" font-size="16" font-weight="bold" text-anchor="middle">
      <tspan x="332" dy="0">Competitive</tspan>
      <tspan x="332" dy="22">Strategy</tspan>
    </text>

    <rect x="450" y="255" width="195" height="180" rx="6" fill="#274472"/>
    <rect x="450" y="255" width="195" height="8" rx="2" fill="#D6A94A"/>
    <text x="547" y="335" fill="#EAF0F7" font-size="16" font-weight="bold" text-anchor="middle">
      <tspan x="547" dy="0">Good Strategy</tspan>
      <tspan x="547" dy="22">Bad Strategy</tspan>
    </text>

    <rect x="665" y="255" width="195" height="180" rx="6" fill="#1B263B"/>
    <rect x="665" y="255" width="195" height="8" rx="2" fill="#D6A94A"/>
    <text x="762" y="335" fill="#EAF0F7" font-size="16" font-weight="bold" text-anchor="middle">
      <tspan x="762" dy="0">Flawless</tspan>
      <tspan x="762" dy="22">Consulting</tspan>
    </text>
  </g>
